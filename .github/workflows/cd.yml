name: 🚀 ByteSentinel CD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:

  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      tag: ${{ steps.set_version.outputs.tag }}

    steps:
      - name: Generate version
        id: set_version
        run: |
          VERSION="$(date +'%Y.%m.%d').${{ github.run_number }}"
          TAG="v$VERSION"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build-agent:
    name: Build Agent
    runs-on: ubuntu-latest
    needs: version

    strategy:
      matrix:
        runtime: [win-x64, linux-x64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Agent
        run: |
          dotnet publish ByteSentinelAgent \
            -c Release \
            -r ${{ matrix.runtime }} \
            --self-contained true \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:FileVersion=${{ needs.version.outputs.version }} \
            -p:InformationalVersion=${{ needs.version.outputs.tag }} \
            -o publish/${{ matrix.runtime }}

      - name: Zip Artifact
        run: |
          cd publish/${{ matrix.runtime }}
          zip -r ../../agent-${{ matrix.runtime }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.runtime }}
          path: agent-${{ matrix.runtime }}.zip

  build-app:
    name: Build MAUI App
    runs-on: windows-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI
        run: dotnet workload install maui

      - name: Build Windows
        run: |
          dotnet publish ByteSentinelApp `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -p:Version=${{ needs.version.outputs.version }} `
            -p:FileVersion=${{ needs.version.outputs.version }} `
            -p:InformationalVersion=${{ needs.version.outputs.tag }} `
            -o publish/windows

      - name: Build Android
        run: |
          dotnet publish ByteSentinelApp `
            -c Release `
            -f net10.0-android `
            -p:Version=${{ needs.version.outputs.version }} `
            -p:FileVersion=${{ needs.version.outputs.version }} `
            -p:InformationalVersion=${{ needs.version.outputs.tag }} `
            -o publish/android

      - name: Zip App
        run: |
          Compress-Archive -Path publish/windows/* -DestinationPath maui-windows.zip
          Compress-Archive -Path publish/android/* -DestinationPath maui-android.zip

      - uses: actions/upload-artifact@v4
        with:
          name: maui-app
          path: |
            maui-windows.zip
            maui-android.zip

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ByteSentinelServer/Dockerfile
          push: true
          tags: |
            patrickcaloriocarvalho/bytesentinel:latest
            patrickcaloriocarvalho/bytesentinel:${{ needs.version.outputs.tag }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-agent, build-app, docker, version]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: List files (debug)
        run: ls -R

      - name: Create Tag (safe)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch --tags

          if git rev-parse ${{ needs.version.outputs.tag }} >/dev/null 2>&1; then
            echo "Tag already exists"
          else
            git tag ${{ needs.version.outputs.tag }}
            git push origin ${{ needs.version.outputs.tag }}
          fi

      - name: Generate Release Notes
        id: notes
        run: |
          VERSION=${{ needs.version.outputs.tag }}

          cat <<EOF > release.md

            ## 📦 Downloads

            ### 🤖 Agent
            - 🪟 Windows: [Download](https://github.com/${{ github.repository }}/releases/download/${VERSION}/agent-win-x64.zip)
            - 🐧 Linux: [Download](https://github.com/${{ github.repository }}/releases/download/${VERSION}/agent-linux-x64.zip)

            ### 🖥️ App (MAUI)
            - 🪟 Windows: [Download](https://github.com/${{ github.repository }}/releases/download/${VERSION}/maui-windows.zip)
            - 🤖 Android: [Download](https://github.com/${{ github.repository }}/releases/download/${VERSION}/maui-android.zip)

            ---

            ## 🐳 Docker

            \`\`\`bash
            docker pull patrickcaloriocarvalho/bytesentinel:${VERSION}
            \`\`\`

            Ou use:

            \`\`\`bash
            docker pull patrickcaloriocarvalho/bytesentinel:latest
            \`\`\`

            ---

            ## 🧠 Informações

            - Version: ${VERSION}
            - Commit: ${{ github.sha }}

            ---
            
            EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: 🚀 ByteSentinel ${{ needs.version.outputs.tag }}
          body_path: release.md
          files: |
            agent-win-x64/agent-win-x64.zip
            agent-linux-x64/agent-linux-x64.zip
            maui-app/maui-windows.zip
            maui-app/maui-android.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}